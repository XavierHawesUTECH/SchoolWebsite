<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Ardenne High School</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header" id="siteHeader"></header>

    <main class="page">
        <h1>Portal sign in</h1>

        <form id="loginForm" class="card" style="max-width: 26rem">
            <fieldset class="grid-form">
                <legend>Your account</legend>
                <label class="full" for="loginUser">Username
                    <input id="loginUser" name="loginUser" type="text" required placeholder="e.g. admin">
                </label>
                <label class="full" for="loginPass">Password
                    <input id="loginPass" name="loginPass" type="password" required placeholder=" ">
                </label>
                <div class="full"><button type="submit">Sign in</button></div>
            </fieldset>
        </form>

        <div id="loginResult" class="msg" role="alert"></div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
    <script defer src="js/app.js"></script>
    <script defer src="js/login.js"></script>
</body>
</html>
