<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact us | Ardenne High School</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header" id="siteHeader"></header>

    <main class="page layout">
      <section>
        <h1>Contact us</h1>

        <form id="contactForm" class="card">
          <fieldset class="grid-form">
            <legend>Send us a message</legend>

            <label for="contactName">Full name <span class="required-mark">*</span>
              <input id="contactName" name="contactName" type="text" required placeholder=" ">
            </label>

            <label for="contactEmail">Email <span class="required-mark">*</span>
              <input id="contactEmail" name="contactEmail" type="email" required
                     placeholder="name@example.com">
            </label>

            <label for="contactPhone">Phone (optional)
              <input id="contactPhone" name="contactPhone" type="text" placeholder="876-555-0123">
            </label>

            <label for="contactTopic">Topic <span class="required-mark">*</span>
              <select id="contactTopic" name="contactTopic" required>
                <option value="">Choose a topic</option>
                <option value="Admissions">Admissions</option>
                <option value="Fees">Fees</option>
                <option value="Grades">Grades</option>
                <option value="Other">Other</option>
              </select>
            </label>

            <div class="full">
              <strong>Reply by</strong>
              <label class="inline">
                <input type="radio" name="replyBy" value="Email" checked> Email
              </label>
              <label class="inline">
                <input type="radio" name="replyBy" value="Phone"> Phone
              </label>
            </div>

            <label class="full" for="contactMessage">Message (20 to 500 characters) <span class="required-mark">*</span>
              <textarea id="contactMessage" name="contactMessage" rows="5" required
                        placeholder=" "></textarea>
            </label>

            <label class="inline full" for="contactConsent">
              <input id="contactConsent" name="contactConsent" type="checkbox">
              I agree the school may contact me about this message.
            </label>

            <div class="full">
              <button type="submit" id="sendButton" disabled>Send message</button>
            </div>
          </fieldset>
        </form>

        <div id="contactResult" class="msg" role="status"></div>
      </section>

      <aside>
        <div class="card">
          <h3>Find us</h3>
          <p>10 Ardenne Road, Kingston, Jamaica</p>
          <iframe class="map-frame" title="Map showing Ardenne High School"
                  src="https://www.google.com/maps?q=10+Ardenne+Road+Kingston+Jamaica&amp;output=embed"></iframe>
        </div>
      </aside>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
    <script defer src="js/app.js"></script>
    <script defer src="js/contact.js"></script>
  </body>
</html>
